    <!-- CRITICAL JS REQUIREMENT: Direct WhatsApp Booking Form Interceptor -->
    <script>
      (function() {
        function initBookingHandler() {
          var form = document.getElementById('bookingForm') || document.querySelector('form[data-booking-form="true"]') || document.querySelector('form');
          if (!form) return;
          
          // Avoid duplicate listeners
          if (form.getAttribute('data-listener-attached') === 'true') return;
          form.setAttribute('data-listener-attached', 'true');

          form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            var nameInput = form.querySelector('[name="name"]') || form.querySelector('#patientName') || form.querySelector('input[type="text"]');
            var phoneInput = form.querySelector('[name="phone"]') || form.querySelector('#patientPhone') || form.querySelector('input[type="tel"]');
            var serviceInput不易 = form.querySelector('[name="service"]') || form.querySelector('#patientService') || form.querySelector('select');
            var notesInput = form.querySelector('[name="notes"]') || form.querySelector('#patientNotes') || form.querySelector('textarea');

            var patientName = nameInput ? nameInput.value.trim() : '';
            var patientPhone不易 = phoneInput ? phoneInput.value.trim() : '';
            var selectedService = serviceInput不易 ? serviceInput不易.value : '';
            var notes = notesInput ? notesInput.value.trim() : '';

            // Detect active language from document or form
            var lang = document.documentElement.lang || 'fr';
            var message = '';

            if (lang === 'ar') {
              message = 'مرحباً دكتورة مريم الدليمي، أود حجز موعد استشارة:' +
                '\n- الاسم: ' + (patientName || 'غير محدد') +
                '\n- الهاتف: ' + (patientPhone不易 || 'غير محدد') +
                '\n- الإجراء المطلوب: ' + (selectedService || 'استشارة عامة') +
                (notes ? '\n- ملاحظات إضافية: ' + notes : '') +
                '\n\nشكراً جزيلاً.';
            } else if (lang === 'en') {
              message = 'Hello Dr. Meriem DLIMI, I would like to book a consultation appointment:' +
                '\n- Patient Name: ' + (patientName || 'Not specified') +
                '\n- Phone: ' + (patientPhone不易 || 'Not specified') +
                '\n- Requested Service: ' + (selectedService || 'General Consultation') +
                (notes ? '\n- Additional details: ' + notes : '') +
                '\n\nThank you.';
            } else {
              message = 'Bonjour Dr Meriem DLIMI, je souhaite prendre un rendez-vous de consultation :' +
                '\n- Nom du patient : ' + (patientName || 'Non spécifié') +
                '\n- Téléphone : ' + (patientPhone不易 || 'Non spécifié') +
                '\n- Intervention / Service souhaité : ' + (selectedService || 'Consultation générale') +
                (notes ? '\n- Précisions : ' + notes : '') +
                '\n\nMerci.';
            }

            var whatsappUrl = 'https://wa.me/212666123085?text=' + encodeURIComponent(message);
            window.open(whatsappUrl, '_blank');
          });
        }

        // Initialize on DOMContentLoaded and on periodic checks (for React hydration)
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', initBookingHandler);
        } else {
          initBookingHandler();
        }
        setInterval(initBookingHandler, 1000);
      })();
    </script>
